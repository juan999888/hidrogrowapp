<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="CSS/index.css" type="text/css">
</head>
<body>
  <style>
    body {
      background-image: url('IMG/lo.webp');
      font-family: 'Inter UI', sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      display: flex;
      height: auto;
      margin: 0 auto;
      width: 700px;
      position: relative;
      background: #474A59;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 40px;
      color: white;
      flex-direction: column;
    }
    label {
      font-size: 14px;
      margin-top: 15px;
      display: block;
    }
    input, select {
      background: transparent;
      border: none;
      border-bottom: 2px solid white;
      color: white;
      font-size: 16px;
      padding: 6px 2px;
      width: 100%;
      outline: none;
    }
    input::placeholder {
      color: #ddd;
    }
    .form-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-section div {
      display: flex;
      flex-direction: column;
    }
    #submit {
      margin-top: 30px;
      padding: 10px;
      background: white;
      color: #474A59;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #submit:hover {
      background: #ddd;
    }
    select, option {
  color: white;        /* Color del texto */
  background-color: #474A59;  /* Fondo del desplegable */
}
  </style>


   <nav class="nav-index">
        <img class="logo" src="IMG/slogo.png" alt="">
      <div id="div-nav">
        <a class="nav" href="index.html">INICIO</a>
        <a id="nav" href="libros.html">LIBROS</a>
        <a class="nav" href="registro.html">REGISTRO</a>
        <a class="nav" href="inicio sesion.html">INICIAR SESIÓN</a>
      </div>
    </nav>
  <article class=""><br><br><br><br>
  <center>
    
      
  <form action="PHP/registro_h.php" method="post">
    <div class="container">
      <h2 style="margin-bottom: 20px;">Registro de Usuario</h2>
      <div class="form-section">
        <div>
          <label for="username">Nombre Usuario</label>
          <input type="text" id="username" name="username" required placeholder="Ej: Juan Pérez" required maxlength="45">
        </div>
        <div>
          <label for="name">Nombres</label>
          <input type="text" id="name" name="name" required placeholder="Ej: jperez123" required maxlength="45" pattern="^[a-zA-Z\s]+$">
        </div>
        <div>
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" required placeholder="Ej: ejemplo@correo.com" required maxlength="45">
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required maxlength="45" minlength="10">
        </div>
        <div>
          <label for="phone">Teléfono</label>
          <input type="tel" id="phone" name="phone" required minlength="10"  placeholder="Número de teléfono" >
        </div>
        <div>
          <label for="documento_">Documento</label>
          <input type="tel" id="documento_" name="documento_" required minlength="8" placeholder="Número de documento" >
        </div>
        <div>
          <label for="t_d">Tipo de documento</label>
          <select id="t_d" name="t_d" required>
            <option value="0">Seleccionar</option>
            <option value="1">C.C</option>
            <option value="2">T.I</option>
            <option value="3">C.E</option>
            <option value="4">Otro</option>
          </select>
        </div>
        
        <div>
          <label for="area">Área</label>
          <select name="area" id="area">
            <option value="0">Seleccionar</option>
            <option value="Control de plagas">Control de plagas y enfermedades</option>
            <option value="Manipulación de nutrientes">Manipulación de nutrientes</option>
            <option value="Supervisión del crecimiento">Supervisión del crecimiento de las plantas</option>
          </select>
        </div>
        <center>
        <div >
          <label for="genero">Género</label>
          <label class="color-fuente-registro" for="gender">Género:</label> <br>
          <input type="radio" class="form-control" id="male" name="gender" value="2">
          <label class="color-fuente-registro" for="gender">Masculino</label>
          <input type="radio" class="form-control" id="female" name="gender" value="1">
          <label class="color-fuente-registro" for="gender">Femenino</label>
          </select>
        </div>
        </center>
      </div>
      <input type="submit" id="submit" value="Registrar" name="registrar">
    </div>
  </form>

    
  </center>
</article>

<br> <br> <br> <br> <br><br> <br> <br> <br> <br><br> <br>
